spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ebookreader
    username: postgres
    password: 12345
  sql:
    init:
      mode: never
      continue-on-error: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          starttls:
            enable: false

  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update
    show-sql: true

  graphql:
    path: /graphql
    graphiql:
      enabled: true
      path: /graphiql
    schema:
      introspection:
        enabled: true

server:
  port: 8080

ebookreader:
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
  password-reset:
    code-ttl-minutes: 15
    max-attempts: 5
